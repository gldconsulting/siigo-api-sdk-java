name: Release SDK to Maven Central

on:
  workflow_dispatch:
    inputs:
      releaseMajorVersion:
        description: After releasing the current version, start the next major SNAPSHOT
        type: boolean
        required: true
        default: false
      releaseMinorVersion:
        description: After releasing the current version, start the next minor SNAPSHOT
        type: boolean
        required: true
        default: false
      dryRun:
        description: Show the release plan without publishing, tags, releases or version commits
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate branch and version options
        env:
          RELEASE_MAJOR: ${{ inputs.releaseMajorVersion }}
          RELEASE_MINOR: ${{ inputs.releaseMinorVersion }}
        run: |
          python3 - <<'PYCODE'
          import os
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Run this workflow from main.')
          if os.environ['RELEASE_MAJOR'] == 'true' and os.environ['RELEASE_MINOR'] == 'true':
              raise SystemExit('Choose major OR minor; leave both false for the next patch.')
          PYCODE
      - name: Test release lifecycle and recovery
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Set up Java 21 and the corporate signing key
        if: ${{ !inputs.dryRun }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check corporate signing identity
        if: ${{ !inputs.dryRun }}
        run: gpg --batch --list-secret-keys 434B3A027E446955BD0F90E692F718364BF0676A
      - name: Release and advance the development version
        env:
          RELEASE_MAJOR: ${{ inputs.releaseMajorVersion }}
          RELEASE_MINOR: ${{ inputs.releaseMinorVersion }}
          DRY_RUN: ${{ inputs.dryRun }}
          GH_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          release_args=()
          if [ "$RELEASE_MAJOR" = "true" ]; then release_args+=(--major); fi
          if [ "$RELEASE_MINOR" = "true" ]; then release_args+=(--minor); fi
          if [ "$DRY_RUN" = "true" ]; then release_args+=(--dry-run); fi
          python3 .github/scripts/release.py "${release_args[@]}"
      - name: Retain release artifacts for diagnostics
        if: ${{ always() && !inputs.dryRun }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk-release-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            target/*.jar
            target/*.asc
            target/*.pom
            target/central-publishing/central-bundle.zip
